<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Recuerdos Boda Gemma & Manuel</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../recursos/favicon_2.ico">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

    <style>
        :root { --accent: #d4af37; --bg: #fcfcfc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #333; }
        body.no-scroll { overflow: hidden; position: fixed; width: 100%; }
        
        header { padding: 40px 20px; text-align: center; }
        h1 { font-weight: 300; letter-spacing: 4px; margin: 0; text-transform: uppercase; }
        .header-img { width: 95%; max-width: 200px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.1)); user-select: none; -webkit-user-drag: none; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 15px; max-width: 1200px; margin: 0 auto; transition: opacity 0.3s ease; }
        @media (min-width: 600px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }
        
        .photo-card { position: relative; background: #f0f0f0; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .photo-card:active { transform: scale(0.95); }
        .photo-card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; opacity: 0; transition: opacity 0.6s ease-in-out; }
        .photo-card.loaded img { opacity: 1; }
        .photo-card p { font-size: 0.85rem; margin: 0; color: #666; text-align: center; padding: 10px; background: white; z-index: 2; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .photo-card b { color: var(--accent); font-weight: 600; margin-left: 4px; }
        
        /* Botón oculto de administrador */
        .btn-delete { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; font-size: 16px; cursor: pointer; z-index: 10; display: none; }
        
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 300; justify-content: center; align-items: center; flex-direction: column; cursor: pointer; }
        #lightbox img { max-width: 95%; max-height: 70%; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: default; }
        #lightbox-caption { color: white; margin-top: 15px; font-size: 1.1rem; text-align: center; cursor: default; }
        #lightbox-message { color: #ccc; margin-top: 8px; font-size: 0.95rem; font-style: italic; text-align: center; max-width: 80%; cursor: default; }
        .close-lightbox { position: absolute; top: 20px; right: 20px; color: white; font-size: 40px; cursor: pointer; padding: 20px; line-height: 1; }
        
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: #000; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; line-height: 0; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 200; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .modal-content { max-width: 450px; margin: 40px auto; padding: 30px; text-align: center; }
        
        /* Nuevo estilo para el textarea */
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: none; }
        
        .btn-send { width: 100%; padding: 18px; background: #000; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: opacity 0.2s; }
        .btn-send:disabled { background: #666; cursor: not-allowed; }
        .close-modal { margin-top: 25px; display: inline-block; color: #999; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }
        
        #progress-container { margin: 20px 0; text-align: left; }
        #preview-area { display: flex; gap: 8px; flex-wrap: wrap; margin: 15px 0; justify-content: center; }
        .thumb-wrapper { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; background: #000; }
        .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s ease; }
        .thumb-wrapper.uploading img { opacity: 0.5; }
        .thumb-wrapper.done img { filter: brightness(0.3) grayscale(100%); opacity: 0.8; }
        
        #infinite-loader { grid-column: 1 / -1; display: none; text-align: center; padding: 20px; }
        .dots-spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.3); border-radius: 50%; border-top-color: var(--accent); animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <img src="../recursos/texto.png" class="header-img" alt="Gemma & Manuel">
        <p style="color: #999; font-weight: 300;">Recuerdos de un día especial</p>
    </header>

    <main class="gallery" id="gallery"></main>
    
    <div id="infinite-loader"><div class="dots-spinner"></div></div>
    
    <div class="fab" onclick="toggleModal(true)">+</div>

    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h2 style="font-weight: 400; margin-top:0;">Subir Fotos</h2>
            <input type="text" id="author" placeholder="Tu nombre">
            
            <textarea id="message" rows="3" placeholder="Déjales un mensaje a los novios (opcional)..."></textarea>
            
            <input type="file" id="fileInput" accept="image/*" multiple onchange="handlePreview(event)">
            
            <div id="preview-area"></div>
            
            <div id="progress-container" style="display:none;">
                <div style="background:#eee; height:8px; border-radius:10px; overflow:hidden;">
                    <div id="progress-bar" style="background:var(--accent); width:0%; height:100%; transition: width 0.3s;"></div>
                </div>
                <p id="progress-text" style="font-size: 0.75rem; margin-top: 8px; color: #666;"></p>
            </div>

            <button class="btn-send" id="btnUpload" onclick="upload()">Enviar a la nube</button>
            <br>
            <span class="close-modal" onclick="toggleModal(false)">Volver a la galería</span>
            <p id="msg" style="margin-top: 15px; font-size: 0.9rem; color: #333; font-weight: bold;"></p>
        </div>
    </div>
    
    <div id="lightbox">
        <span class="close-lightbox" onclick="document.getElementById('lightbox').style.display='none'">&times;</span>
        <img id="lightbox-img" src="">
        <div id="lightbox-caption"></div>
        <div id="lightbox-message"></div>
        <a id="download-btn" href="" download="boda-recuerdo.jpg" style="color: var(--accent); text-decoration: none; margin-top: 15px; font-size: 0.9rem; border: 1px solid var(--accent); padding: 5px 15px; border-radius: 20px; cursor: pointer; pointer-events: auto;">Descargar Foto</a>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Falló:', err));
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, startAfter, serverTimestamp, doc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

        // CONFIGURACIÓN FIREBASE
		const firebaseConfig = {
			apiKey: "AIzaSyCRiBrkGxFFv9XwhjXp8hcpSMhA4F7jpy4",
			authDomain: "boda-gemma-manuel.firebaseapp.com",
			projectId: "boda-gemma-manuel",
			storageBucket: "boda-gemma-manuel.firebasestorage.app",
			messagingSenderId: "697901596318",
			appId: "1:697901596318:web:1c1189dc61d7017a0a058f",
			measurementId: "G-NQN6E14WY8"
		  };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Variables Globales
        let selectedFiles = [];
        let isLoading = false;
        let allPhotosLoaded = false;
        let lastVisibleDoc = null; 
        let scrollPos = 0;
        
        // --- LÓGICA DE ADMINISTRADOR ---
        window.isAdmin = false;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('modo') === 'admin') {
            const pass = prompt("Clave de moderador:");
            if (pass === "240427") {
                window.isAdmin = true;
                alert("Modo Administrador Activado. Podrás borrar fotos.");
            }
        }

        signInAnonymously(auth).catch((error) => console.error(error));

        window.onload = () => {
            const savedAuthor = localStorage.getItem('boda_author');
            if(savedAuthor) document.getElementById('author').value = savedAuthor;
            
            onAuthStateChanged(auth, (user) => {
                if (user && !lastVisibleDoc && !isLoading) loadGallery();
            });
        };

        async function loadGallery() {
            if (isLoading || allPhotosLoaded) return;
            isLoading = true;
            
            const footerLoader = document.getElementById('infinite-loader');
            if (lastVisibleDoc && footerLoader) footerLoader.style.display = 'block';

            try {
                // Filtramos por estado "active" para ignorar las borradas
                const fotosRef = collection(db, "fotos_boda");
                let q = query(fotosRef, where("status", "==", "active"), orderBy("timestamp", "desc"), limit(12));
                
                if (lastVisibleDoc) {
                    q = query(fotosRef, where("status", "==", "active"), orderBy("timestamp", "desc"), startAfter(lastVisibleDoc), limit(12));
                }

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    allPhotosLoaded = true;
                    if (!lastVisibleDoc) document.getElementById('gallery').innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#999;">Aún no hay fotos.</p>';
                    if (footerLoader) footerLoader.style.display = 'none';
                    return;
                }

                lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1];

                const imagesData = querySnapshot.docs.map(doc => {
                    const data = doc.data();
                    return { id: doc.id, url: data.url, author: data.author, message: data.message };
                });

                await renderBatch(imagesData);

            } catch (error) {
                console.error("Error Firestore:", error);
            } finally {
                isLoading = false;
                if (footerLoader) footerLoader.style.display = 'none';
            }
        }

        async function renderBatch(images) {
            const gallery = document.getElementById('gallery');
            for (const img of images) {
                if (document.querySelector(`img[src="${img.url}"]`)) continue;

                await new Promise((resolve) => {
                    const card = document.createElement('div');
                    card.className = 'photo-card loaded';
                    // Pasamos también el mensaje
                    card.onclick = () => window.openLightbox(img.url, img.author, img.message);
                    
                    const imageElement = document.createElement('img');
                    imageElement.setAttribute('loading', 'lazy'); 
                    imageElement.onload = () => setTimeout(resolve, 50); 
                    imageElement.onerror = resolve;
                    imageElement.src = img.url;

                    const info = document.createElement('p');
                    info.innerHTML = `Por: <b>${img.author}</b>`;

                    // Si es admin, inyectamos el botón de borrado
                    if (window.isAdmin) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'btn-delete';
                        delBtn.innerHTML = '🗑️';
                        delBtn.style.display = 'block';
                        delBtn.onclick = (e) => {
                            e.stopPropagation(); // Evita que se abra el lightbox
                            window.softDelete(img.id, card);
                        };
                        card.appendChild(delBtn);
                    }

                    card.appendChild(imageElement);
                    card.appendChild(info);
                    gallery.appendChild(card);
                });
            }
        }

        // Observer (Scroll infinito)
        const sentinel = document.createElement('div');
        sentinel.style.height = '50px'; 
        document.getElementById('gallery').after(sentinel);
        new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && !allPhotosLoaded) loadGallery();
        }, { rootMargin: '300px' }).observe(sentinel);

        // --- FUNCIONES GLOBALES ---

        window.openLightbox = function(url, author, message) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = url;
            document.getElementById('download-btn').href = url; 
            document.getElementById('lightbox-caption').innerHTML = `Foto de <b>${author}</b>`;
            
            const msgBox = document.getElementById('lightbox-message');
            if (message && message.trim() !== "") {
                msgBox.innerText = `"${message}"`;
                msgBox.style.display = "block";
            } else {
                msgBox.style.display = "none";
            }
            
            lb.style.display = 'flex';
        };

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });

        window.toggleModal = function(show) {
            const modal = document.getElementById('uploadModal');
            if (show) {
                scrollPos = window.pageYOffset;
                modal.style.display = 'block';
                document.body.classList.add('no-scroll');
                document.body.style.top = `-${scrollPos}px`;
            } else {
                modal.style.display = 'none';
                document.body.classList.remove('no-scroll');
                document.body.style.top = '';
                window.scrollTo(0, scrollPos);
                
                document.getElementById('preview-area').innerHTML = '';
                document.getElementById('msg').innerText = '';
                document.getElementById('progress-container').style.display = 'none';
                document.getElementById('fileInput').value = '';
                document.getElementById('message').value = ''; // Limpiar textarea
                selectedFiles = [];
            }
        };

        window.handlePreview = function(e) {
            selectedFiles = Array.from(e.target.files);
            const area = document.getElementById('preview-area');
            area.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'thumb-wrapper';
                wrapper.id = `thumb-${index}`;
                wrapper.innerHTML = `<img src="${URL.createObjectURL(file)}">`;
                area.appendChild(wrapper);
            });
        };

        // Función de borrado lógico (Solo Admin)
        window.softDelete = async function(docId, cardElement) {
            if (confirm("¿Ocultar esta foto de la galería?")) {
                cardElement.style.opacity = '0.3';
                try {
                    await updateDoc(doc(db, "fotos_boda", docId), { status: "hidden" });
                    cardElement.remove();
                } catch (error) {
                    alert("Error al borrar. Verifica conexión.");
                    cardElement.style.opacity = '1';
                }
            }
        };

        window.upload = async function() {
            const btn = document.getElementById('btnUpload');
            if (btn.disabled || selectedFiles.length === 0) return; 

            const author = document.getElementById('author').value.trim() || "Invitado";
            const messageText = document.getElementById('message').value.trim();
            const progBar = document.getElementById('progress-bar');
            
            btn.disabled = true;
            btn.style.opacity = '0.5';
            document.getElementById('progress-container').style.display = "block";
            localStorage.setItem('boda_author', author);

            const uid = auth.currentUser ? auth.currentUser.uid : "anon";
            let activeUploads = 0;
            let currentIndex = 0;
            let errores = 0;

            async function processPool() {
                if (currentIndex >= selectedFiles.length) return;
                
                const i = currentIndex++;
                const originalFile = selectedFiles[i];
                activeUploads++;
                
                try {
                    const compressedFile = await imageCompression(originalFile, { maxSizeMB: 1, maxWidthOrHeight: 1200, useWebWorker: true });
                    const storageRef = ref(storage, `fotos_boda/${Date.now()}_${compressedFile.name}`);
                    await uploadBytesResumable(storageRef, compressedFile);
                    const downloadURL = await getDownloadURL(storageRef);

                    // Payload final con dedicatoria y control de estado
                    await addDoc(collection(db, "fotos_boda"), {
                        url: downloadURL,
                        storagePath: storageRef.fullPath,
                        author: author,
                        message: messageText,
                        uploaderUid: uid,
                        status: "active",
                        timestamp: serverTimestamp()
                    });

                    document.getElementById(`thumb-${i}`).classList.add('done');
                } catch (error) {
                    errores++;
                    document.getElementById(`thumb-${i}`).style.border = "2px solid red"; 
                } finally {
                    activeUploads--;
                    progBar.style.width = Math.round(((currentIndex - activeUploads) / selectedFiles.length) * 100) + "%";
                    await processPool(); 
                }
            }

            const workers = Array(3).fill(null).map(() => processPool());
            await Promise.all(workers);

            setTimeout(() => {
                if (errores === 0) {
                    window.toggleModal(false);
                    document.getElementById('gallery').innerHTML = '';
                    lastVisibleDoc = null; 
                    allPhotosLoaded = false;
                    loadGallery();
                }
                btn.disabled = false;
                btn.style.opacity = '1';
            }, 2000);
        };
    </script>
</body>
</html>
