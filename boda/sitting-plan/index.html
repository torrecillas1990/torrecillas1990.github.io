<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seating Plan - 24 Abril 2027</title>
    <!-- Librerías -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Layout Principal */
        body {
            display: flex;
            flex-direction: row; /* Cambio a layout horizontal */
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            box-sizing: border-box;
            gap: 20px;
            overflow: hidden; /* Evita scroll en toda la página */
        }

        /* Panel Lateral (Sidebar) */
        .sidebar {
            width: 320px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto; /* Scroll solo en el panel lateral si hay muchos controles */
            padding-right: 5px;
        }
        
        .sidebar h1 { margin: 0; color: #334155; font-size: 24px; }
        .instrucciones { color: #64748b; font-size: 13px; margin-bottom: 10px; }

        /* Tarjetas de Controles */
        .panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel h3 { margin: 0; font-size: 15px; color: #475569; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;}

        /* Elementos de Formulario y Botones */
        .input-text { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .row-flex { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; width: 100%; box-sizing: border-box; display: flex; justify-content: center; align-items: center; gap: 5px;}
        
        /* Colores de Botones */
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-green { background-color: #10b981; color: white; }
        .btn-red { background-color: #ef4444; color: white; }
        .btn-cyan { background-color: #0ea5e9; color: white; }
        .btn-gray { background-color: #64748b; color: white; }
        .btn-light { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        
        /* Hover states */
        .btn:hover { filter: brightness(0.95); }

        /* Lienzo */
        .canvas-wrapper {
            flex-grow: 1; /* Ocupa el resto del espacio disponible */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e2e8f0; /* Fondo gris para diferenciar el área de trabajo */
            border-radius: 8px;
            overflow: hidden;
        }
        .canvas-container {
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: Panel Izquierdo -->
    <aside class="sidebar">
        
        <div>
            <h1>Seating Plan</h1>
            <div class="instrucciones">Arrastra los invitados a las mesas. Pulsa <code>Supr</code> para eliminar lo seleccionado.</div>
        </div>

        <!-- Panel de Mesas -->
        <div class="panel">
            <h3>Mesas</h3>
            <input type="text" id="nombreMesa" class="input-text" placeholder="Nombre (ej. Mesa 3)">
            <label class="row-flex" style="font-size: 13px; color: #475569;">
                Capacidad: 
                <input type="number" id="capacidadMesa" class="input-text" value="8" min="2" max="15" style="width: 70px;">
            </label>
            <div class="row-flex">
                <button class="btn btn-blue" onclick="agregarMesa()">+ Añadir</button>
                <button class="btn btn-red" onclick="eliminarMesa()">🗑️ Borrar</button>
            </div>
        </div>

        <!-- Panel de Invitados -->
        <div class="panel">
            <h3>Invitados Individuales</h3>
            <input type="text" id="nombreInvitado" class="input-text" placeholder="Nombre (ej. Tío Juan)">
            <div class="row-flex">
                <button class="btn btn-green" onclick="agregarInvitado()">+ Añadir</button>
                <button class="btn btn-red" onclick="eliminarInvitado()">🗑️ Borrar</button>
            </div>
        </div>

        <!-- Panel de Datos (I/O) -->
        <div class="panel">
            <h3>Importar / Exportar</h3>
            
            <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv" style="display: none;">
            <button class="btn btn-cyan" onclick="document.getElementById('inputExcel').click()">📥 Cargar Excel de Invitados</button>
            
            <button class="btn btn-light" onclick="toggleAyudaExcel()">? Ayuda formato Excel</button>
            
            <div id="cajaAyudaExcel" style="display: none; background-color: #f8fafc; border: 1px solid #bfdbfe; padding: 10px; border-radius: 4px; font-size: 12px; color: #334155; margin-top: 5px;">
                <strong>Formato del Excel (.xlsx):</strong><br>
                - 1ª pestaña (Hoja 1).<br>
                - Nombres en la <strong>Columna A</strong>.<br>
                - Sin cabeceras (la fila 1 se importará).
            </div>

            <hr style="width: 100%; border: 0; border-top: 1px solid #e2e8f0; margin: 5px 0;">

            <button class="btn btn-gray" onclick="guardarProyecto()">💾 Guardar Plano (.json)</button>
            <input type="file" id="inputJSON" accept=".json" style="display: none;">
            <button class="btn btn-gray" onclick="document.getElementById('inputJSON').click()">📂 Cargar Plano (.json)</button>
            
            <!-- NUEVO: Botón para exportar a imagen -->
            <hr style="width: 100%; border: 0; border-top: 1px solid #e2e8f0; margin: 5px 0;">
            <button class="btn btn-blue" onclick="exportarImagen()">🖼️ Exportar a PNG (Imprimir)</button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL: Lienzo -->
    <main class="canvas-wrapper">
        <!-- El tamaño del canvas puede quedarse fijo o puedes hacerlo dinámico por JS luego -->
        <canvas id="lienzo-boda" width="900" height="750"></canvas>
    </main>

    <script>
        // 1. Inicializar Lienzo
        // Desactivamos la selección grupal para evitar arrastrar accidentalmente mesa + invitados a la vez
        const canvas = new fabric.Canvas('lienzo-boda', { selection: false });
        const radioMesaVisual = 60; 

        // 2. FUNCIÓN: Crear una Mesa
        function crearMesa(x, y, nombre, capacidadMax) {
            const circulo = new fabric.Circle({
                radius: radioMesaVisual,
                fill: '#f1f5f9',
                stroke: '#3b82f6',
                strokeWidth: 3,
                originX: 'center',
                originY: 'center'
            });
            
            const texto = new fabric.Text(nombre + ` (${capacidadMax})`, {
                fontSize: 16,
                fontFamily: 'sans-serif',
                fontWeight: 'bold',
                fill: '#1e293b',
                originX: 'center',
                originY: 'center'
            });

            const mesa = new fabric.Group([circulo, texto], {
                left: x,
                top: y,
                originX: 'center',
                originY: 'center',
                hasControls: false,
                hasBorders: true,         // MODIFICADO: Mostrar borde al seleccionar
                borderColor: '#f59e0b',   // NUEVO: Borde naranja para saber cuál está seleccionada
                borderDashArray: [5, 5],  // NUEVO: Borde punteado
                tipoObjeto: 'mesa',
                nombreAsignado: nombre,
                capacidadMax: capacidadMax,
                invitadosSentados: []
            });
            
            return mesa;
        }

        // 3. FUNCIÓN: Crear un Invitado
        function crearInvitado(x, y, nombre) {
            const fondo = new fabric.Rect({
                width: 90,
                height: 30,
                fill: '#fecaca', // Rojo por defecto
                rx: 15,          // Bordes redondeados
                ry: 15,
                originX: 'center',
                originY: 'center'
            });
            
            const texto = new fabric.Text(nombre, {
                fontSize: 14,
                fontFamily: 'sans-serif',
                fill: '#7f1d1d',
                originX: 'center',
                originY: 'center'
            });

            const invitado = new fabric.Group([fondo, texto], {
                left: x,
                top: y,
                originX: 'center', // Clave para centrar exactamente en la coordenada calculada
                originY: 'center',
                hasControls: false,
                hasBorders: true,        // MODIFICADO: Mostrar borde al seleccionar
                borderColor: '#dc2626',  // NUEVO: Borde rojo fuerte para destacarlo
                borderDashArray: [4, 4], // NUEVO: Borde punteado
                tipoObjeto: 'invitado',
                nombreAsignado: nombre
            });
			
            return invitado;
        }

        // 4. FUNCIÓN MAESTRA: Reposicionar en círculo
        function reposicionarInvitadosEnCirculo(mesa) {
            const invitados = mesa.invitadosSentados;
            const numInvitados = invitados.length;
            if (numInvitados === 0) return;

            // Al tener originX/originY en 'center', left y top son el centro exacto
            const cx = mesa.left; 
            const cy = mesa.top;

            // Distancia del centro de la mesa al centro del invitado
            const radioAsiento = radioMesaVisual + 40; 

            invitados.forEach((invitadoObj, index) => {
                // Cálculo del ángulo en radianes
                const angulo = (index / numInvitados) * (2 * Math.PI);

                // Fórmula trigonométrica
                const xFinal = cx + (radioAsiento * Math.cos(angulo));
                const yFinal = cy + (radioAsiento * Math.sin(angulo));

                // Mover invitado y ponerlo por encima de todo
                invitadoObj.set({ left: xFinal, top: yFinal });
                invitadoObj.bringToFront();
                
                // Actualizar estilo visual a "sentado" (Verde)
                invitadoObj.item(0).set('fill', '#dcfce7'); 
                invitadoObj.item(1).set('fill', '#166534');
            });
        }

        // 5. EVENTO: Lógica al terminar de arrastrar un objeto
        canvas.on('object:modified', function(options) {
            const objetoMovido = options.target;
            
            // Solo procesamos colisiones si movemos un invitado o una mesa
            if (objetoMovido.tipoObjeto === 'mesa') {
                // Si movemos la mesa, reposicionamos a todos sus invitados para que la sigan
                reposicionarInvitadosEnCirculo(objetoMovido);
                canvas.renderAll();
                return;
            }
            
            if (objetoMovido.tipoObjeto !== 'invitado') return;

            const mesas = canvas.getObjects().filter(obj => obj.tipoObjeto === 'mesa');
            let mesaDestino = null;

            // Comprobar si soltamos el invitado sobre alguna mesa
            mesas.forEach(mesa => {
                if (objetoMovido.intersectsWithObject(mesa)) {
                    mesaDestino = mesa;
                }
            });

            // A. Primero, limpiar el invitado de cualquier mesa anterior en la que estuviera
            mesas.forEach(m => {
                if (m.invitadosSentados.includes(objetoMovido)) {
                    m.invitadosSentados = m.invitadosSentados.filter(inv => inv !== objetoMovido);
                    reposicionarInvitadosEnCirculo(m); // Reajustar a los que se quedan
                }
            });

            // B. Evaluar el destino
            if (mesaDestino) {
                // Comprobar capacidad
                if (mesaDestino.invitadosSentados.length >= mesaDestino.capacidadMax) {
                    // Si está llena, devolvemos al invitado a un estado "sin mesa" (rojo)
                    objetoMovido.item(0).set('fill', '#fecaca'); 
                    objetoMovido.item(1).set('fill', '#7f1d1d');
                    alert(`La ${mesaDestino.nombreAsignado} ya está al máximo de su capacidad.`);
                } else {
                    // Añadir a la nueva mesa y reposicionar
                    mesaDestino.invitadosSentados.push(objetoMovido);
                    reposicionarInvitadosEnCirculo(mesaDestino);
                }
            } else {
                // Si se ha soltado en el vacío, marcar como "pendiente" (rojo)
                objetoMovido.item(0).set('fill', '#fecaca'); 
                objetoMovido.item(1).set('fill', '#7f1d1d');
            }

            canvas.renderAll();
        });

        // 6. CARGA DE DATOS INICIALES (MOCKUP)
        
        // Instanciar mesas (x, y, nombre, capacidad)
        const mesa1 = crearMesa(300, 350, 'Mesa 1', 6);
        //const mesa2 = crearMesa(600, 350, 'Mesa 2', 6);
        canvas.add(mesa1);

        // Lista de invitados de prueba
        const listaNombres = [];

        // Instanciar invitados en una columna inicial
        listaNombres.forEach((nombre, index) => {
            const xInicial = 100;
            const yInicial = 50 + (index * 45); // Espaciado vertical
            const inv = crearInvitado(xInicial, yInicial, nombre);
            canvas.add(inv);
        });
		
		// 7. NUEVAS FUNCIONES: AÑADIR Y QUITAR MESAS

        let contadorNuevasMesas = 1; // Ya tenemos 1 y 2 en los datos de prueba

        function agregarMesa() {
            const inputNombre = document.getElementById('nombreMesa');
            const inputCapacidad = document.getElementById('capacidadMesa');
            
            // Si el campo está vacío, generamos un nombre automático
            const nombre = inputNombre.value.trim() || `Mesa ${contadorNuevasMesas}`;
            const capacidad = parseInt(inputCapacidad.value) || 8;

            // Las colocamos en el centro del lienzo, con un ligero desvío aleatorio 
            // para que si creas varias rápido, no se solapen exactamente
            const xCentro = (canvas.width / 2) + (Math.random() * 40 - 20);
            const yCentro = (canvas.height / 2) + (Math.random() * 40 - 20);

            const nuevaMesa = crearMesa(xCentro, yCentro, nombre, capacidad);
            canvas.add(nuevaMesa);
            
            // Preparamos el terreno para la siguiente
            contadorNuevasMesas++;
            inputNombre.value = ''; 
        }

        function eliminarMesa() {
            // Obtenemos el objeto que el usuario tiene seleccionado con el ratón
            const objetoActivo = canvas.getActiveObject();

            if (!objetoActivo) {
                alert("Primero haz clic en la mesa que quieres eliminar.");
                return;
            }

            if (objetoActivo.tipoObjeto === 'mesa') {
                // 1. Liberar a los invitados sentados
                objetoActivo.invitadosSentados.forEach(invitadoObj => {
                    // Volver a pintarlos de rojo (pendientes)
                    invitadoObj.item(0).set('fill', '#fecaca'); 
                    invitadoObj.item(1).set('fill', '#7f1d1d');
                    
                    // Opcional: moverlos un poco hacia el centro para que no queden 
                    // haciendo un círculo en el vacío.
                    invitadoObj.set({
                        left: canvas.width / 2 + (Math.random() * 100 - 50),
                        top: canvas.height / 2 + (Math.random() * 100 - 50)
                    });
                });

                // 2. Eliminar la mesa del lienzo
                canvas.remove(objetoActivo);
                canvas.discardActiveObject(); // Quitar la selección
                canvas.renderAll();
                
            } else if (objetoActivo.tipoObjeto === 'invitado') {
                alert("Has seleccionado a un invitado. Esta función solo elimina mesas.");
            }
        }
		
		// 8. NUEVAS FUNCIONES: AÑADIR Y QUITAR INVITADOS

        function agregarInvitado() {
            const inputNombre = document.getElementById('nombreInvitado');
            const nombre = inputNombre.value.trim();
            
            if (!nombre) {
                alert("Por favor, introduce el nombre del invitado.");
                return;
            }

            // Los hacemos aparecer en el lado izquierdo de la pantalla (zona de "pendientes")
            // Añadimos un poco de aleatoriedad para que no caigan exactamente uno encima del otro
            const xInicial = 100 + (Math.random() * 20 - 10);
            const yInicial = 100 + (Math.random() * 300);

            const nuevoInvitado = crearInvitado(xInicial, yInicial, nombre);
            canvas.add(nuevoInvitado);
            
            // Limpiamos el input y devolvemos el foco para que puedas escribir rápido
            inputNombre.value = ''; 
            inputNombre.focus();
        }

        function eliminarInvitado() {
            const objetoActivo = canvas.getActiveObject();

            if (!objetoActivo) {
                alert("Primero haz clic en el invitado que quieres eliminar.");
                return;
            }

            if (objetoActivo.tipoObjeto === 'invitado') {
                // 1. Si está en una mesa, quitarlo del array de la mesa y reordenar
                const mesas = canvas.getObjects().filter(obj => obj.tipoObjeto === 'mesa');
                mesas.forEach(m => {
                    if (m.invitadosSentados.includes(objetoActivo)) {
                        // Lo quitamos del array interno de la mesa
                        m.invitadosSentados = m.invitadosSentados.filter(inv => inv !== objetoActivo);
                        // ¡Clave! Reposicionamos la mesa para que se cierre el hueco
                        reposicionarInvitadosEnCirculo(m); 
                    }
                });

                // 2. Eliminar al invitado del lienzo
                canvas.remove(objetoActivo);
                canvas.discardActiveObject();
                canvas.renderAll();
                
            } else if (objetoActivo.tipoObjeto === 'mesa') {
                alert("Has seleccionado una mesa. Usa el botón de eliminar mesa.");
            }
        }
		
		// ==========================================
        // 9. IMPORTAR Y EXPORTAR DATOS
        // ==========================================

        // --- A. IMPORTAR INVITADOS DESDE EXCEL ---
        document.getElementById('inputExcel').addEventListener('change', function(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // Cogemos la primera pestaña del Excel
                const primeraHoja = workbook.Sheets[workbook.SheetNames[0]];
                // Convertimos a array (header: 1 devuelve un array de arrays por filas)
                const filas = XLSX.utils.sheet_to_json(primeraHoja, {header: 1});

                let contadorY = 50;
                let contadorX = 50;

                filas.forEach(fila => {
                    const nombre = fila[0]; // Suponemos que el nombre está en la Columna A
                    if (nombre && typeof nombre === 'string' && nombre.trim() !== '') {
                        // Los colocamos en forma de cuadrícula a la izquierda
                        const nuevoInvitado = crearInvitado(contadorX, contadorY, nombre.trim());
                        canvas.add(nuevoInvitado);
                        
                        contadorY += 40;
                        if (contadorY > canvas.height - 50) {
                            contadorY = 50;
                            contadorX += 110;
                        }
                    }
                });
                
                // Reseteamos el input por si quieres cargar el mismo archivo otra vez
                evento.target.value = ''; 
                canvas.renderAll();
                alert("Invitados cargados con éxito.");
            };
            lector.readAsArrayBuffer(archivo);
        });

        // --- B. EXPORTAR ESTADO (GUARDAR JSON) ---
        function guardarProyecto() {
            const estado = { mesas: [], invitados: [] };

            canvas.getObjects().forEach(obj => {
                if (obj.tipoObjeto === 'mesa') {
                    estado.mesas.push({
                        nombre: obj.nombreAsignado,
                        capacidadMax: obj.capacidadMax,
                        left: obj.left,
                        top: obj.top
                    });
                } else if (obj.tipoObjeto === 'invitado') {
                    // Buscar si el invitado está dentro del array de alguna mesa
                    const mesas = canvas.getObjects().filter(o => o.tipoObjeto === 'mesa');
                    const mesaAsignada = mesas.find(m => m.invitadosSentados.includes(obj));

                    estado.invitados.push({
                        nombre: obj.nombreAsignado,
                        left: obj.left,
                        top: obj.top,
                        mesaId: mesaAsignada ? mesaAsignada.nombreAsignado : null
                    });
                }
            });

            // Crear el archivo para descargar
            const dataStr = JSON.stringify(estado, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const enlace = document.createElement('a');
            enlace.href = url;
            enlace.download = 'seating_plan_boda.json';
            enlace.click();
            URL.revokeObjectURL(url);
        }

        // --- C. IMPORTAR ESTADO (CARGAR JSON) ---
        document.getElementById('inputJSON').addEventListener('change', function(evento) {
            const archivo = evento.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const estado = JSON.parse(e.target.result);
                    
                    // Limpiar lienzo
                    canvas.clear();
                    
                    const diccionarioMesas = {}; // Para enlazar rápido los invitados

                    // 1. Recrear Mesas
                    if (estado.mesas) {
                        estado.mesas.forEach(m => {
                            const nuevaMesa = crearMesa(m.left, m.top, m.nombre, m.capacidadMax);
                            canvas.add(nuevaMesa);
                            diccionarioMesas[m.nombre] = nuevaMesa;
                        });
                    }

                    // 2. Recrear Invitados
                    if (estado.invitados) {
                        estado.invitados.forEach(inv => {
                            const nuevoInv = crearInvitado(inv.left, inv.top, inv.nombre);
                            canvas.add(nuevoInv);
                            
                            // Si estaba en una mesa, lo volvemos a meter en su array
                            if (inv.mesaId && diccionarioMesas[inv.mesaId]) {
                                diccionarioMesas[inv.mesaId].invitadosSentados.push(nuevoInv);
                            }
                        });
                    }

                    // 3. Reordenar las mesas cargadas para actualizar los colores a verde
                    Object.values(diccionarioMesas).forEach(mesa => {
                        reposicionarInvitadosEnCirculo(mesa);
                    });

                    canvas.renderAll();
                    // Reseteamos input
                    evento.target.value = '';
                    
                } catch (error) {
                    alert("Error al cargar el archivo JSON. Verifica que sea válido.");
                }
            };
            lector.readAsText(archivo);
        });
		
		// 10. FUNCIÓN PARA MOSTRAR/OCULTAR LA AYUDA DEL EXCEL
        function toggleAyudaExcel() {
            const caja = document.getElementById('cajaAyudaExcel');
            if (caja.style.display === 'none') {
                caja.style.display = 'block';
            } else {
                caja.style.display = 'none';
            }
        }
		
		// 11. EXPORTAR LIENZO A IMAGEN (PNG)
        function exportarImagen() {
            // 1. Quitamos la selección activa para que no salgan los bordes punteados en la foto
            canvas.discardActiveObject();
            canvas.renderAll();

            // 2. Extraemos la imagen del canvas
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1,
                multiplier: 2 // Multiplica la resolución x2 para impresión de alta calidad
            });

            // 3. Forzamos la descarga del archivo
            const enlace = document.createElement('a');
            enlace.href = dataURL;
            enlace.download = 'plano_salon_24_abril.png';
            enlace.click();
        }
		
		// Añadir este listener en cualquier parte de tu script
        window.addEventListener('keydown', function(evento) {
            if (evento.key === 'Delete' || evento.key === 'Backspace') {
                const objetoActivo = canvas.getActiveObject();
                
                // Evitamos borrar cosas si estás escribiendo dentro de un <input>
                if (document.activeElement.tagName !== 'INPUT' && objetoActivo) {
                    if (objetoActivo.tipoObjeto === 'mesa') {
                        eliminarMesa();
                    } else if (objetoActivo.tipoObjeto === 'invitado') {
                        eliminarInvitado();
                    }
                }
            }
        });
		
    </script>
</body>
</html>
