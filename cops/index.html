<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar PWA</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
	
    <link rel="icon" type="image/x-icon" href="./recursos/favicon.ico">
	
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="ProPhoto Editor">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<!-- Icono principal para iPhone Retina (180x180) -->
	<link rel="apple-touch-icon" href="./recursos/apple-icon-180x180.png">

	<!-- Opcional: Iconos específicos para diferentes tamaños -->
	<link rel="apple-touch-icon" sizes="152x152" href="./recursos/apple-icon-152x152.png"> <!-- iPad -->
	<link rel="apple-touch-icon" sizes="167x167" href="./recursos/apple-icon-167x167.png"> <!-- iPad Pro -->
	
</head>
<body>
	
	<div id="filter-container">
        <div style="display: flex; gap: 8px;">
            <input type="text" id="filter-input" placeholder="Indicativo (ej. IBE)..." autocomplete="off">
            <button id="filter-btn">Buscar</button>
        </div>
        
        <div id="type-filters">
            <label><input type="checkbox" value="commercial" checked> Comercial / Pesado</label>
            <label><input type="checkbox" value="light" checked> Ligero / Avioneta</label>
            <label><input type="checkbox" value="heli" checked> Helicópteros</label>
            <label><input type="checkbox" value="other" checked> Otros (Drones, Globos...)</label>
            <label><input type="checkbox" value="unknown" checked> Sin Clasificar</label>
        </div>
		<div id="legend-container">
			<div><span style="background: #3b82f6;"></span> Comercial / Pesado</div>
			<div><span style="background: #22c55e;"></span> Avioneta / Ligero</div>
			<div><span style="background: #f97316;"></span> Helicóptero</div>
			<div><span style="background: #ef4444;"></span> Militar / Caza</div>
			<div><span style="background: #a855f7;"></span> Drone (UAV)</div>
			<div><span style="background: #aaaaaa;"></span> Desconocido / Otro</div>
		</div>
    </div>
	
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>

</body>
</html>
